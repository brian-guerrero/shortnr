name: Multi-database tests

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - 'feat/prd-016-*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test-postgres:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shortnr_test
          POSTGRES_USER: shortnr
          POSTGRES_PASSWORD: shortnr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test tests/Shortnr.Tests.Integration/Shortnr.Tests.Integration.csproj --no-build --configuration Release
        env:
          Database__Provider: Postgres
          Database__ConnectionString: Host=localhost;Port=5432;Database=shortnr_test;Username=shortnr;Password=shortnr

  test-mysql:
    name: Test with MySQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: shortnr_test
          MYSQL_USER: shortnr
          MYSQL_PASSWORD: shortnr
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test tests/Shortnr.Tests.Integration/Shortnr.Tests.Integration.csproj --no-build --configuration Release
        env:
          Database__Provider: MySql
          Database__ConnectionString: Server=localhost;Port=3306;Database=shortnr_test;User=shortnr;Password=shortnr
