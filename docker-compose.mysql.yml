services:
  shortnr:
    image: ghcr.io/brian-guerrero/shortnr:latest
    container_name: shortnr
    ports:
      - "8080:8080"
    environment:
      - Database__Provider=MySql
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=shortnr;User=shortnr;Password=shortnr
      - Authentication__Enabled=true
      - DataProtection__KeyPath=/data/dataprotection-keys
    volumes:
      - shortnr-data:/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: shortnr-mysql
    environment:
      - MYSQL_DATABASE=shortnr
      - MYSQL_USER=shortnr
      - MYSQL_PASSWORD=shortnr
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "shortnr", "-pshortnr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  shortnr-data:
  mysql-data:
