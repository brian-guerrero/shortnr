services:
  shortnr:
    image: ghcr.io/brian-guerrero/shortnr:latest
    container_name: shortnr
    ports:
      - "8080:8080"
    environment:
      - Database__Provider=Sqlite
      - RateLimiting__Provider=Redis
      - RateLimiting__Redis__ConnectionString=redis:6379
      - Authentication__Enabled=true
      - DataProtection__KeyPath=/data/dataprotection-keys
    volumes:
      - shortnr-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shortnr-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  shortnr-data:
