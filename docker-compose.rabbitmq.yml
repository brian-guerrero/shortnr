services:
  shortnr:
    image: ghcr.io/brian-guerrero/shortnr:latest
    container_name: shortnr
    ports:
      - "8080:8080"
    environment:
      - Database__Provider=Sqlite
      - EventBus__Provider=RabbitMQ
      - EventBus__RabbitMQ__ConnectionString=amqp://guest:guest@rabbitmq:5672
      - EventBus__RabbitMQ__Exchange=shortnr.events
      - Authentication__Enabled=true
      - DataProtection__KeyPath=/data/dataprotection-keys
    volumes:
      - shortnr-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shortnr-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  shortnr-data:
  rabbitmq-data:
