# fly.toml app configuration file generated for shortnr on 2026-08-06T05:11:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shortnr'
primary_region = 'iad'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[env]
  Authentication__Enabled = 'true'
  ASPNETCORE_ENVIRONMENT = 'Production'
  RateLimiting__TrustForwardedFor = 'true'
  # Safe to trust here: Fly's edge proxy is the only way to reach this app,
  # and it overwrites (not appends to) X-Forwarded-* on every request.
  Hosting__TrustForwardedHeaders = 'true'
  # Authentication:Oidc:Authority/ClientId/ClientSecret and the OAuth signing/
  # encryption certs are managed entirely via `fly secrets set` — do not add
  # them here too. A `fly deploy` re-applies this [env] block into the same
  # machine env map as secrets, so a value defined in both places here would
  # silently overwrite whatever was set via secrets on every deploy.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
