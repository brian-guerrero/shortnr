# fly.toml app configuration file generated for shortnr on 2026-08-06T05:11:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shortnr'
primary_region = 'iad'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[env]
  Authentication__Enabled = 'true'
  ASPNETCORE_ENVIRONMENT = 'Production'
  RateLimiting__TrustForwardedFor = 'true'
  # Auth0 tenant domain and app Client ID (not secret). Set the matching
  # ClientSecret via `fly secrets set Authentication__Oidc__ClientSecret=...`
  # instead — never commit it here.
  Authentication__Oidc__Authority = 'https://YOUR_TENANT.auth0.com/'
  Authentication__Oidc__ClientId = 'YOUR_AUTH0_CLIENT_ID'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
