services:
  shortnr:
    image: ghcr.io/brian-guerrero/shortnr:latest
    container_name: shortnr
    ports:
      - "8080:8080"
    environment:
      - Database__Provider=Postgres
      - Database__ConnectionString=Host=postgres;Database=shortnr;Username=shortnr;Password=shortnr
      - Authentication__Enabled=true
      - DataProtection__KeyPath=/data/dataprotection-keys
    volumes:
      - shortnr-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: shortnr-postgres
    environment:
      - POSTGRES_DB=shortnr
      - POSTGRES_USER=shortnr
      - POSTGRES_PASSWORD=shortnr
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortnr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  shortnr-data:
  postgres-data:
